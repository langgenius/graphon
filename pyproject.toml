[project]
name = 'graphon'
version = '0.7.0'
description = 'Graph execution engine for agentic AI workflows.'
readme = 'README.md'
license = 'Apache-2.0'
license-files = ['LICENSE']
# Keep Python support aligned with `unstructured`, which currently declares
# `Requires-Python: <3.14,>=3.11`.
requires-python = '>=3.12,<3.14'
dependencies = [
    'charset-normalizer>=2.1',
    'defusedxml>=0.7',
    'httpx>=0.28',
    'json-repair>=0.55',
    'jsonschema>=4.18',
    'odfdo>=3.22.8',
    'orjson>=3',
    'pandas[excel]>=2.1',
    'pydantic>=2.7',
    'pydantic-extra-types>=2',
    'pypdf>=6.14.2',
    'pypdfium2>=5',
    'python-docx>=1.2',
    'pyyaml>=6',
    'tiktoken>=0.12',
    'transformers>=4',
    'typing-extensions>=4.10.0',
    'unstructured[docx,md,ppt,pptx]>=0.21',
    'webvtt-py>=0.5',
]

[project.urls]
source = 'https://github.com/langgenius/graphon'
homepage = 'https://github.com/langgenius/graphon'
issues = 'https://github.com/langgenius/graphon/issues'

[dependency-groups]
dev = [
    'pytest',
    'pytest-benchmark',
    'pytest-cov',
    'pytest-mock',
    'pytest-xdist',
    'ruff',
    'prek',
    'ty',
    'gevent>=26.8.0',
    "import-linter>=2.15",
]

[build-system]
requires = ['uv_build>=0.12.2,<0.13']
build-backend = 'uv_build'

[tool.uv]
default-groups = ['dev']
prerelease = 'disallow'

[tool.ruff]
fix = true
preview = true
required-version = '>=0.15'

[tool.ruff.lint]
select = ['ALL']
ignore = [
    'missing-trailing-comma',  # Conflicts with `ruff format`.
    'commented-out-code',  # False positives are common.
    'TC',      # Runtime use of typing constructs is common now.
    'CPY',     # Covered by the standalone LICENSE file.
    'too-many-arguments', # Explicit is better than implicit.
    'too-many-positional-arguments', # Complex is better than complicated.
    'no-self-use', # Violates the usual practice.
    'D',       # Too verbose.
    'FBT',     # Too strict.
    'relative-imports',  # Too absolute.
    'any-type',  # We hope to enforce this, but typing is still evolving.
]

[tool.ruff.lint.pydoclint]
ignore-one-line-docstrings = true

[tool.ruff.lint.per-file-ignores]
'tests/**/*.py' = [
    'assert',    # Assert statements used for pytest.
    'magic-value-comparison', # Magic value used in test cases.
    'import-private-name', # Allow import private members from graphon module.
    'compare-to-empty-string', # be more precise about assertion in tests.

    # permit calls of private methods until we separate
    # public interface tests from implementation tests.
    'private-member-access', # allow calls of private class methods in tests
]

[tool.ty.environment]
python-platform = 'linux'

[tool.importlinter]
root_package = 'graphon'
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
id = 'runtime-ownership'
name = 'Runtime owns state and queues without importing engine'
type = 'forbidden'
source_modules = ['graphon.runtime']
forbidden_modules = ['graphon.engine']
broken_contract_guidance = 'Use graphon.runtime.ready_queue for queue contracts, tasks, and the default queue; runtime must not depend on graphon.engine.'

[[tool.importlinter.contracts]]
id = 'execution-adapters'
name = 'Execution core does not import DSL adapters'
type = 'forbidden'
source_modules = ['graphon.engine', 'graphon.graph', 'graphon.runtime', 'graphon.nodes', 'graphon.protocols']
forbidden_modules = ['graphon.dsl']
broken_contract_guidance = 'Inject consumer-owned protocols; assemble concrete adapters in graphon.dsl or the host application.'

[[tool.importlinter.contracts]]
id = 'node-contracts'
name = 'Public contracts do not import Code or LLM implementations'
type = 'forbidden'
source_modules = ['graphon.protocols', 'graphon.nodes.code.protocols', 'graphon.nodes.llm.protocols', 'graphon.nodes.llm.runtime_protocols', 'graphon.nodes.protocols', 'graphon.nodes.runtime']
forbidden_modules = ['graphon.engine', 'graphon.nodes.code.code_node', 'graphon.nodes.llm.node']
broken_contract_guidance = 'Import code contracts from graphon.nodes.code.protocols and LLM contracts from graphon.nodes.llm.protocols or runtime_protocols; import node classes explicitly during bootstrap.'

[tool.pytest]
minversion = '9.0'
addopts = ['--benchmark-disable', '-n', 'auto']
testpaths = ['tests']
